name: Generate downloadable portfolio résumé PDF
on:
  push:
    branches:
      - feature/recruiter-audit-downloadable-resume
    paths:
      - 'scripts/generate-resume-pdf.mjs'
      - 'scripts/audit-site.mjs'
      - '.github/workflows/generate-resume-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install site and PDF browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the site and print the actual résumé page
        run: |
          npm run build
          node scripts/generate-resume-pdf.mjs
          timeout 240s node scripts/audit-site.mjs
      - name: Publish PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-resume-pdf
          path: public/conor-brown-resume.pdf
      - name: Commit generated PDF into the feature branch
        if: github.ref_name == 'feature/recruiter-audit-downloadable-resume'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/conor-brown-resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add downloadable browser-verified résumé PDF [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
